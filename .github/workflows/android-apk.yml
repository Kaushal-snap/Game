name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/2d8682d3-game

permissions:
  contents: write

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          sdk_path="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_path" ]]; then
            echo "Android SDK directory not found: $sdk_path" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_path" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_path" >> "$GITHUB_ENV"
          echo "$sdk_path/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_path/platform-tools" >> "$GITHUB_PATH"
          test -x "$sdk_path/cmdline-tools/latest/bin/sdkmanager"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon -p android-app assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raasta6-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK for direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/raasta6-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/raasta6-debug.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged; no repository update needed."
          else
            git commit -m "Publish Android debug APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
