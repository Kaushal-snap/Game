plugins {
    id 'com.android.application'
}

android {
    namespace 'com.raasta6.devgarh'
    compileSdk 35

    defaultConfig {
        applicationId 'com.raasta6.devgarh'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/web-assets"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'game.js', 'styles.css'
    }
    into layout.buildDirectory.dir('generated/web-assets/www')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}
